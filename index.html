
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9ja_go - The Ultimate Nigerian Life Sim</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Screen 1: Character Creation -->
        <div id="creation-screen" class="screen">
            <h1>🇳🇬 9ja_go</h1>
            <p>From JSS1 to the real world. Choose your destiny.</p>
            <input type="text" id="char-name" placeholder="Enter Character Name..." />
            <select id="char-gender">
                <option value="Male">Male 👤</option>
                <option value="Female">Female 👩‍🦰</option>
            </select>
            <button onclick="startJourney()">Begin JSS1 (Age 12)</button>
        </div>

        <!-- Screen 2: Main Game Loop / School Phase -->
        <div id="main-screen" class="screen hidden">
            <div class="header-stats">
                <span id="display-name">Name: </span>
                <span id="display-age">Age: 12</span>
                <span id="display-class">Class: JSS1</span>
                <span id="display-bank">Balance: ₦5,000</span>
            </div>
            
            <div class="panel">
                <h3>School Life & Activities</h3>
                <p id="status-text">You just entered JSS1. Make wise choices!</p>
                <button onclick="passTerm()">Complete Term & Advance</button>
            </div>

            <!-- Wheel Event Screen (Triggers at Age 18) -->
            <div id="wheel-section" class="panel hidden">
                <h3>The Wheel of Fate (Age 18)</h3>
                <p>Spin to determine your background: Lapo (Trenches) or Nepo (Soft life)!</p>
                <button onclick="spinWheel()">Spin the Wheel 🎡</button>
                <div id="wheel-result"></div>
            </div>

            <!-- Job Market (Unlocked at Age 18) -->
            <div id="job-section" class="panel hidden">
                <h3>Choose Your Career Path</h3>
                <div id="job-list"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
